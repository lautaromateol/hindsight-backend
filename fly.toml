# Despliegue en Fly.io. El nombre de la app debe ser único: cambialo antes de `fly launch --no-deploy --copy-config`.
app = "escolio-api"
primary_region = "gru"

[build]

[deploy]
  # Aplica las migraciones con MIGRATION_DATABASE_URL (dueño de las tablas) antes de cada release.
  release_command = "npx prisma migrate deploy"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
